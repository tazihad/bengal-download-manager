[workspace]
resolver = "2"
members = [
    "crates/tigris",
    "crates/bengal-core",
    "crates/bengal-db",
    "crates/bengal-ipc",
    "crates/bengal-media",
    "crates/bengal-grabber",
    "apps/bengal-desktop",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
tigris = { path = "crates/tigris" }
bengal-core = { path = "crates/bengal-core" }
bengal-db = { path = "crates/bengal-db" }
bengal-ipc = { path = "crates/bengal-ipc" }
bengal-media = { path = "crates/bengal-media" }
bengal-grabber = { path = "crates/bengal-grabber" }

axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
clap_complete = "4.5"

tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = "0.17"
anyhow = "1.0"
thiserror = "2.0"
dirs = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.10"
futures-util = "0.3"
tokio-socks = "0.5"
base64 = "0.22"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
percent-encoding = "2.3"
regex = "1.11"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui_extras = { version = "0.31", features = ["all_loaders", "image"] }
rfd = "0.15"
open = "5.3"
notify-rust = "4.11"
ring = "0.17"
arboard = "3.4"
