name: "bengal-download-manager"
arch: "${NFPM_ARCH}"
platform: "linux"
version: "${VERSION}"
section: "net"
priority: "optional"
maintainer: "Zihad <tazihad@gmail.com>"
description: |
  Bengal Download Manager is a high-performance, multi-threaded open-source download manager powered by Aria2 and PyQt6.
homepage: "https://github.com/tazihad/bengal-download-manager"
license: "MIT"

contents:
  - src: "${PKG_DIR}/usr/bin/bengal-download-manager"
    dst: "/usr/bin/bengal-download-manager"
    file_info:
      mode: 0755
  - src: "${PKG_DIR}/usr/share/"
    dst: "/usr/share/"

overrides:
  deb:
    depends:
      - aria2
      - ffmpeg
      - ca-certificates
      - xdg-utils
      - libgl1
      - libegl1
      - libdbus-1-3
  rpm:
    depends:
      - aria2
      - ffmpeg
      - ca-certificates
      - xdg-utils
      - mesa-libGL
      - mesa-libEGL
      - dbus-libs
