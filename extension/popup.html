<!DOCTYPE html>
<html data-theme="system">

<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg: #ffffff;
            --text: #333333;
            --border: #e2e8f0;
            --success: #22c55e;
            --error: #ef4444;
        }

        [data-theme="dark"] {
            --bg: #1e293b;
            --text: #f8fafc;
            --border: #334155;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 15px;
            width: 200px;
            margin: 0;
            transition: 0.2s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header h3 {
            margin: 0;
            font-size: 15px;
        }

        .settings-btn {
            cursor: pointer;
            color: var(--text);
            text-decoration: none;
            font-size: 16px;
            opacity: 0.7;
        }

        .settings-btn:hover {
            opacity: 1;
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            font-size: 14px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.04);
        }

        [data-theme="dark"] .status-box {
            background: rgba(255, 255, 255, 0.05);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: gray;
            transition: 0.3s;
        }

        .dot.online {
            background: var(--success);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
        }

        .dot.offline {
            background: var(--error);
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>

<body>
    <div class="header">
        <h3>Bengal DM</h3>
        <a href="#" id="options-link" class="settings-btn" title="Settings">⚙️</a>
    </div>

    <div class="status-box">
        <div id="dot" class="dot"></div>
        <span id="status-text">Connecting...</span>
    </div>

    <script src="popup.js"></script>
</body>

</html>
