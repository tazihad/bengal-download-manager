<!DOCTYPE html>
<html data-theme="system">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="options.css">
</head>

<body>
    <div class="card">
        <h2>Settings</h2>

        <label>Aria2 Port: <input type="number" id="port" placeholder="56800"></label>
        <label>RPC Secret (Optional): <input type="password" id="token" placeholder="Leave blank if none"></label>

        <label>UI Theme:
            <select id="theme">
                <option value="system">System Default</option>
                <option value="light">Light Mode</option>
                <option value="dark">Dark Mode</option>
            </select>
        </label>

        <div class="status-section">
            <div class="status-left">
                <div id="dot" class="dot"></div>
                <span id="conn-text">Checking...</span>
            </div>
            <button id="refresh-btn" class="refresh-btn" title="Test Connection">🔄</button>
        </div>

        <button id="save" class="save-btn">Save Preferences</button>
        <button id="sync" class="sync-btn">Sync from Bengal DM</button>
        <button id="reset" class="reset-btn">Reset to Defaults</button>
        <div id="status-msg"></div>
    </div>
    <script src="options.js"></script>
</body>

</html>
