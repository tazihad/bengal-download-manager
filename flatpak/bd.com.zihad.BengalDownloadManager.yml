app-id: bd.com.zihad.BengalDownloadManager
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: bengal-download-manager

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --env=QT_QPA_PLATFORMTHEME=xdgdesktopportal

modules:
  - python3-requirements.yaml

  - name: bengal-download-manager
    buildsystem: cmake
    sources:
      - type: dir
        path: .
