[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bengal-download-manager"
dynamic = ["version"]
description = "High-speed multi-threaded download manager powered by PyQt6, KDE Kirigami, and Aria2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Zihad", email = "tazihad@gmail.com" }
]
keywords = [
    "download-manager",
    "aria2",
    "pyqt6",
    "qt6",
    "kirigami",
    "multithreaded",
    "media-downloader",
    "desktop-app",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.8.0",
    "python-socks[asyncio]>=3.1.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.12.0",
]
dev = [
    "pyinstaller>=6.12.0",
    "pytest>=8.3.0",
    "pytest-qt>=4.5.0",
]

[project.scripts]
bengal-download-manager = "main:main"

[project.urls]
Homepage = "https://github.com/tazihad/bengal-download-manager"
Documentation = "https://github.com/tazihad/bengal-download-manager#readme"
Repository = "https://github.com/tazihad/bengal-download-manager.git"
Issues = "https://github.com/tazihad/bengal-download-manager/issues"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
