name: Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for auto-increment)'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark as Pre-release / Alpha'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        uses: ./.github/actions/setup-apt
        with:
          packages: libqt6gui6 desktop-file-utils appstream

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Desktop Entry and Metainfo
        run: |
          desktop-file-validate flatpak/io.github.tazihad.bengal-download-manager.desktop
          appstreamcli validate flatpak/io.github.tazihad.bengal-download-manager.metainfo.xml

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          pytest -v tests/

  prepare:
    name: Determine Tag
    needs: [test]
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
      version: ${{ steps.get_tag.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Tag
        id: get_tag
        uses: ./.github/actions/determine-tag
        with:
          manual_tag: ${{ github.event.inputs.tag_name }}

  build:
    name: Build (${{ matrix.arch }})
    needs: [test, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        uses: ./.github/actions/setup-apt
        with:
          packages: libqt6gui6 cmake zip libfuse2 aria2 zsync

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Update Version File
        uses: ./.github/actions/update-version
        with:
          version: ${{ needs.prepare.outputs.version }}

      - name: Build Binary
        uses: ./.github/actions/build-binary
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}

      - name: Import GPG Key for AppImage Signing
        if: env.HAS_GPG == 'true'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build AppImage
        uses: ./.github/actions/build-appimage
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}
          sign: ${{ env.HAS_GPG == 'true' }}
          gpg_key: ${{ steps.import_gpg.outputs.keyid }}

      - name: Build Extension
        if: matrix.arch == 'x86_64'
        uses: ./.github/actions/build-extension

      - name: Build Flatpak Bundle
        uses: ./.github/actions/build-flatpak
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}

      - name: Stage Release Artifacts
        run: |
          mkdir -p release_artifacts
          cp build_cmake/dist/bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }} release_artifacts/ 2>/dev/null || true
          cp bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.AppImage release_artifacts/ 2>/dev/null || true
          cp bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.AppImage.zsync release_artifacts/ 2>/dev/null || true
          cp dist/bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.flatpak release_artifacts/ 2>/dev/null || cp bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.flatpak release_artifacts/ 2>/dev/null || true
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp extension-chromium.crx release_artifacts/ 2>/dev/null || true
            cp extension-firefox.xpi release_artifacts/ 2>/dev/null || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.arch }}
          path: release_artifacts/*

  release:
    name: Publish Release
    needs: [test, prepare, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release_dist

      - name: Generate Checksums & Release Notes Body
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          export BASE_URL="${SERVER_URL}/${REPOSITORY}/releases/download/${TAG}"
          cd release_dist
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true

          python3 - << 'EOF'
          import os

          tag = os.environ.get("TAG", "")
          base_url = os.environ.get("BASE_URL", "")
          version = os.environ.get("VERSION", "")

          files = [f for f in sorted(os.listdir(".")) if os.path.isfile(f) and f not in ("SHA256SUMS.txt",)]

          def categorize(filename):
              if filename.endswith(".AppImage"):
                  arch = "ARM64" if "aarch64" in filename else "x86_64"
                  return (1, f"🐧 **Linux AppImage ({arch})**", filename)
              elif filename.endswith(".flatpak"):
                  arch = "ARM64" if "aarch64" in filename else "x86_64"
                  return (2, f"📦 **Flatpak Bundle ({arch})**", filename)
              elif filename.endswith(".crx"):
                  return (3, "🌐 **Chrome / Chromium Extension**", filename)
              elif filename.endswith(".xpi"):
                  return (4, "🌐 **Firefox Extension**", filename)
              elif filename.endswith(".zsync"):
                  return (6, "🔄 **AppImage ZSync Delta**", filename)
              else:
                  arch = "ARM64" if "aarch64" in filename else "x86_64"
                  return (5, f"⚙️ **Standalone Binary ({arch})**", filename)

          categorized = [categorize(f) for f in files]
          categorized.sort(key=lambda x: (x[0], x[2]))

          lines = []
          lines.append("### 📦 Packages & Direct Downloads\n")
          lines.append("| Platform / Format | Download Link |")
          lines.append("|---|---|")
          for _, label, fname in categorized:
              url = f"{base_url}/{fname}"
              lines.append(f"| {label} | [{fname}]({url}) |")
          lines.append(f"| 📄 **SHA-256 Checksums** | [SHA256SUMS.txt]({base_url}/SHA256SUMS.txt) |")
          lines.append("\n---\n")
          lines.append("### 🔒 Checksums (SHA-256)\n```text")
          
          if os.path.exists("SHA256SUMS.txt"):
              with open("SHA256SUMS.txt", "r") as f:
                  lines.append(f.read().strip())
          lines.append("```\n\n---\n")

          with open("../release_body.md", "w") as f:
              f.write("\n".join(lines))
          EOF

          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          body_path: release_body.md
          files: release_dist/*
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, 'alpha') || contains(needs.prepare.outputs.tag, 'beta') || contains(needs.prepare.outputs.tag, 'rc') || inputs.is_prerelease }}
          generate_release_notes: true
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
