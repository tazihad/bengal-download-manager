name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for auto-increment)'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark as Pre-release / Alpha'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        uses: ./.github/actions/setup-apt
        with:
          packages: libqt6gui6 desktop-file-utils appstream

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Desktop Entry and Metainfo
        run: |
          desktop-file-validate flatpak/io.github.tazihad.bengal-download-manager.desktop
          appstreamcli validate flatpak/io.github.tazihad.bengal-download-manager.metainfo.xml

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          pytest -v tests/

  prepare:
    name: Determine Tag
    needs: [test]
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
      version: ${{ steps.get_tag.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Tag
        id: get_tag
        uses: ./.github/actions/determine-tag
        with:
          manual_tag: ${{ github.event.inputs.tag_name }}

  build:
    name: Build (${{ matrix.arch }})
    needs: [test, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        uses: ./.github/actions/setup-apt
        with:
          packages: libqt6gui6 cmake zip libfuse2 aria2 zsync

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Update Version File
        uses: ./.github/actions/update-version
        with:
          version: ${{ needs.prepare.outputs.version }}

      - name: Build Binary
        uses: ./.github/actions/build-binary
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}

      - name: Import GPG Key for AppImage Signing
        if: env.HAS_GPG == 'true'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build AppImage
        uses: ./.github/actions/build-appimage
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}
          sign: ${{ env.HAS_GPG == 'true' }}
          gpg_key: ${{ steps.import_gpg.outputs.keyid }}

      - name: Build Extension
        if: matrix.arch == 'x86_64'
        uses: ./.github/actions/build-extension

      - name: Build Flatpak Bundle
        uses: ./.github/actions/build-flatpak
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}

      - name: Build Snap Package
        uses: ./.github/actions/build-snap
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}

      - name: Stage Release Artifacts
        run: |
          mkdir -p release_artifacts
          cp dist/*.tar.xz release_artifacts/ 2>/dev/null || cp build_cmake/dist/*.tar.xz release_artifacts/ 2>/dev/null || true
          cp bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.AppImage release_artifacts/ 2>/dev/null || true
          cp bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.AppImage.zsync release_artifacts/ 2>/dev/null || true
          cp dist/bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.flatpak release_artifacts/ 2>/dev/null || cp bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.flatpak release_artifacts/ 2>/dev/null || true
          cp dist/*.snap release_artifacts/ 2>/dev/null || cp *.snap release_artifacts/ 2>/dev/null || true
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp extension-chromium-*.crx release_artifacts/ 2>/dev/null || cp extension-chromium.crx release_artifacts/ 2>/dev/null || true
            cp extension-firefox-*.xpi release_artifacts/ 2>/dev/null || cp extension-firefox.xpi release_artifacts/ 2>/dev/null || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.arch }}
          path: release_artifacts/*

  release:
    name: Publish Release
    needs: [test, prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release_dist

      - name: Generate SHA256SUMS Checksums
        run: |
          cd release_dist
          rm -f SHA256SUMS SHA256SUMS.sig SHA256SUMS.txt
          sha256sum * > SHA256SUMS
          cd ..

      - name: Import GPG Key for Release Signing
        if: env.HAS_GPG == 'true'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign SHA256SUMS (GPG Detached Signature)
        if: env.HAS_GPG == 'true'
        run: |
          cd release_dist
          gpg --batch --yes --detach-sign --armor --output SHA256SUMS.sig SHA256SUMS
          cd ..

      - name: Generate Release Notes Body
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          HAS_GPG: ${{ env.HAS_GPG }}
        run: |
          export BASE_URL="${SERVER_URL}/${REPOSITORY}/releases/download/${TAG}"

          python3 - << 'EOF'
          import os
          import re

          tag = os.environ.get("TAG", "")
          base_url = os.environ.get("BASE_URL", "")
          version = os.environ.get("VERSION", "")
          repo = os.environ.get("REPOSITORY", "tazihad/bengal-download-manager")
          has_gpg = os.environ.get("HAS_GPG", "false") == "true"

          os.chdir("release_dist")
          special_files = {"SHA256SUMS", "SHA256SUMS.sig", "SHA256SUMS.txt"}
          files = [f for f in sorted(os.listdir(".")) if os.path.isfile(f) and f not in special_files and not f.endswith(".zsync")]

          linux_groups = {"AppImage": [], "Flatpak": [], "Snap": [], ".tar.xz": []}
          windows_items = []
          macos_items = []
          extension_items = []

          for fname in files:
              arch = "aarch64" if ("aarch64" in fname or "arm64" in fname) else "x86_64"
              url = f"{base_url}/{fname}"

              if fname.endswith(".AppImage"):
                  linux_groups["AppImage"].append((arch, fname, url))
              elif fname.endswith(".flatpak"):
                  linux_groups["Flatpak"].append((arch, fname, url))
              elif fname.endswith(".snap"):
                  linux_groups["Snap"].append((arch, fname, url))
              elif fname.endswith(".tar.xz"):
                  linux_groups[".tar.xz"].append((arch, fname, url))
              elif fname.endswith(".exe") or ("windows" in fname and fname.endswith(".zip")):
                  pkg = "Setup Installer" if "setup" in fname.lower() else ("Portable ZIP" if fname.endswith(".zip") else "Standalone Executable")
                  windows_items.append((pkg, arch, fname, url, ""))
              elif fname.endswith(".dmg") or ("macos" in fname and fname.endswith(".zip")):
                  pkg = ".dmg" if fname.endswith(".dmg") else ".zip"
                  macos_items.append((pkg, "Universal", fname, url, ""))
              elif fname.endswith(".crx"):
                  match = re.search(r"extension-chromium-?(.*?)\.crx", fname)
                  ext_ver = f"v{match.group(1)}" if match and match.group(1) else "v0.8"
                  extension_items.append(("Chrome / Chromium / Edge / Brave", ext_ver, ".crx", fname, url, "Drag into chrome://extensions (Developer mode ON)"))
              elif fname.endswith(".xpi"):
                  match = re.search(r"extension-firefox-?(.*?)\.xpi", fname)
                  ext_ver = f"v{match.group(1)}" if match and match.group(1) else "v0.8"
                  extension_items.append(("Firefox / Floorp / LibreWolf", ext_ver, ".xpi", fname, url, "Open or install via about:addons"))

          lines = []

          has_linux = any(len(items) > 0 for items in linux_groups.values())
          if has_linux:
              lines.append("### 🐧 Linux\n")
              lines.append("<table>")
              lines.append("  <thead>")
              lines.append("    <tr>")
              lines.append("      <th style=\"width: 15%;\">Package / Format</th>")
              lines.append("      <th style=\"text-align: center; width: 12%;\">Architecture</th>")
              lines.append("      <th style=\"white-space: nowrap;\">Download Link</th>")
              lines.append("      <th style=\"width: 25%;\">Notes</th>")
              lines.append("    </tr>")
              lines.append("  </thead>")
              lines.append("  <tbody>")

              linux_notes = {
                  "AppImage": "Universal standalone bundle",
                  "Flatpak": "Single-file offline bundle",
                  "Snap": "Canonical Snap package",
                  ".tar.xz": "Portable tarball archive"
              }

              for pkg in ["AppImage", "Flatpak", "Snap", ".tar.xz"]:
                  items = linux_groups.get(pkg, [])
                  if not items:
                      continue
                  items.sort(key=lambda x: 0 if x[0] == "x86_64" else 1)
                  count = len(items)
                  note = linux_notes.get(pkg, "")
                  first = True
                  for arch, fname, url in items:
                      lines.append("    <tr>")
                      if first:
                          if count > 1:
                              lines.append(f'      <td rowspan="{count}"><b>{pkg}</b></td>')
                          else:
                              lines.append(f'      <td><b>{pkg}</b></td>')
                      lines.append(f'      <td style="text-align: center;"><code>{arch}</code></td>')
                      lines.append(f'      <td style="white-space: nowrap;"><a href="{url}">{fname}</a></td>')
                      if first:
                          if count > 1:
                              lines.append(f'      <td rowspan="{count}">{note}</td>')
                          else:
                              lines.append(f'      <td>{note}</td>')
                      lines.append("    </tr>")
                      first = False

              lines.append("  </tbody>")
              lines.append("</table>\n")

          if windows_items:
              lines.append("### 🪟 Windows\n")
              lines.append("| Package / Format | Architecture | Download Link | Notes |")
              lines.append("| :--- | :---: | :--- | :--- |")
              for pkg, arch, fname, url, note in windows_items:
                  lines.append(f"| **{pkg}** | `{arch}` | [{fname}]({url}) | {note} |")
              lines.append("")

          if macos_items:
              lines.append("### 🍎 macOS\n")
              lines.append("| Package / Format | Architecture | Download Link | Notes |")
              lines.append("| :--- | :---: | :--- | :--- |")
              for pkg, arch, fname, url, note in macos_items:
                  lines.append(f"| **{pkg}** | `{arch}` | [{fname}]({url}) | {note} |")
              lines.append("")

          if extension_items:
              lines.append("### 🌐 Browser Extensions\n")
              lines.append("| Browser Target | Extension Ver | Format | Download Link | Installation Guide |")
              lines.append("| :--- | :---: | :---: | :--- | :--- |")
              for browser, ext_ver, fmt, fname, url, guide in extension_items:
                  lines.append(f"| **{browser}** | `{ext_ver}` | `{fmt}` | [{fname}]({url}) | {guide} |")
              lines.append("")

          lines.append("---\n")
          is_stable = not any(k in tag.lower() for k in ("alpha", "beta", "rc", "dev"))
          
          # Pre-collapsed Verification & Security
          lines.append("<details>")
          lines.append("<summary><b>🛡️ Verification & Security Guide</b> — <i>Click to expand</i></summary>\n")
          if is_stable:
              lines.append("#### GitHub Artifact Attestation (Sigstore SLSA)\n")
              lines.append("Every artifact in this release is signed and attested via GitHub Artifact Attestations.\n")
              lines.append("Verify the provenance of any downloaded binary with the GitHub CLI:\n```bash")
              lines.append(f"gh attestation verify <downloaded-file> --repo {repo}")
              lines.append("```\n")

          if os.path.exists("SHA256SUMS.sig"):
              lines.append("#### GPG Signature & Checksum Verification\n```bash")
              lines.append("# Verify SHA256SUMS signature")
              lines.append("gpg --verify SHA256SUMS.sig SHA256SUMS\n")
              lines.append("# Verify binary checksum")
              lines.append("sha256sum -c SHA256SUMS --ignore-missing")
              lines.append("```\n")
          else:
              lines.append("#### Checksum Verification\n```bash")
              lines.append("sha256sum -c SHA256SUMS --ignore-missing")
              lines.append("```\n")
          lines.append("</details>\n")

          # Pre-collapsed Checksums (SHA-256)
          if os.path.exists("SHA256SUMS"):
              lines.append("<details>")
              lines.append("<summary><b>🔒 Checksums (SHA-256)</b> — <i>Click to expand</i></summary>\n")
              lines.append("```text")
              with open("SHA256SUMS", "r") as f:
                  lines.append(f.read().strip())
              lines.append("```")
              lines.append("</details>\n")

          with open("../release_body.md", "w") as f:
              f.write("\n".join(lines))
          EOF

      - name: Generate Artifact Attestation for Stable Release
        if: ${{ !(contains(needs.prepare.outputs.tag, 'alpha') || contains(needs.prepare.outputs.tag, 'beta') || contains(needs.prepare.outputs.tag, 'rc') || contains(needs.prepare.outputs.tag, 'dev') || inputs.is_prerelease) }}
        uses: actions/attest@v4
        with:
          subject-path: 'release_dist/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release_body.md
          files: release_dist/*
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, 'alpha') || contains(needs.prepare.outputs.tag, 'beta') || contains(needs.prepare.outputs.tag, 'rc') || inputs.is_prerelease }}
          generate_release_notes: true
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
