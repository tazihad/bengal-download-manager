name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for auto-increment)'
        required: false
        default: ''
  push:
    branches:
      - dev
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libqt6gui6 cmake zip libfuse2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6

      - name: Determine Tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            # Find latest tag
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0-alpha.0")
            echo "Latest tag found: $LATEST_TAG"
            
            # Regex to match vX.Y.Z-suffix.N
            if [[ $LATEST_TAG =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-([a-zA-Z]+)\.([0-9]+)$ ]]; then
                X="${BASH_REMATCH[1]}"
                Y="${BASH_REMATCH[2]}"
                Z="${BASH_REMATCH[3]}"
                SUFFIX="${BASH_REMATCH[4]}"
                N="${BASH_REMATCH[5]}"
                
                if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                    # PR Merge to Main: Increment Patch (Z) and reset N to 1
                    NEXT_Z=$((Z + 1))
                    TAG="v${X}.${Y}.${NEXT_Z}-${SUFFIX}.1"
                else
                    # Push to Dev or others: Increment trailing counter N
                    NEXT_N=$((N + 1))
                    TAG="v${X}.${Y}.${Z}-${SUFFIX}.${NEXT_N}"
                fi
            else
                # Fallback for unknown format
                TAG="${LATEST_TAG}-build-${{ github.run_number }}"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "Release Tag: $TAG"

      - name: Build Binary
        uses: ./.github/actions/build-binary
        with:
          version: ${{ steps.get_tag.outputs.version }}

      - name: Build AppImage
        uses: ./.github/actions/build-appimage
        with:
          version: ${{ steps.get_tag.outputs.version }}

      - name: Build Extension
        run: |
          cd extension
          zip -r ../extension-firefox.xpi . -x "*.git*" -x "__pycache__*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          files: |
            build_cmake/dist/bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64
            bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64.AppImage
            extension-firefox.xpi
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
