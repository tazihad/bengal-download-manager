name: CD / Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for auto-increment)'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark as Pre-release / Alpha'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install System Dependencies
        uses: ./.github/actions/setup-apt
        with:
          packages: libqt6gui6 desktop-file-utils appstream

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate Desktop Entry and Metainfo
        run: |
          desktop-file-validate flatpak/bd.com.zihad.BengalDownloadManager.desktop
          appstreamcli validate --no-net flatpak/bd.com.zihad.BengalDownloadManager.metainfo.xml

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          pytest -v tests/

  prepare:
    name: Determine Tag
    needs: [test]
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
      version: ${{ steps.get_tag.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Tag
        id: get_tag
        uses: ./.github/actions/determine-tag
        with:
          manual_tag: ${{ github.event.inputs.tag_name }}

  build:
    name: Build (${{ matrix.arch }})
    needs: [test, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install System Dependencies
        uses: ./.github/actions/setup-apt
        with:
          packages: libqt6gui6 cmake zip libfuse2 aria2 zsync

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Update Version File
        uses: ./.github/actions/update-version
        with:
          version: ${{ needs.prepare.outputs.version }}

      - name: Build Binary
        uses: ./.github/actions/build-binary
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}

      - name: Import GPG Key for AppImage Signing
        if: env.HAS_GPG == 'true'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build AppImage
        uses: ./.github/actions/build-appimage
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}
          sign: ${{ env.HAS_GPG == 'true' }}
          gpg_key: ${{ steps.import_gpg.outputs.keyid }}

      - name: Build Extension
        if: matrix.arch == 'x86_64'
        uses: ./.github/actions/build-extension

      - name: Build Flatpak Bundle
        uses: ./.github/actions/build-flatpak
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}
          sign: ${{ env.HAS_GPG == 'true' }}
          gpg_key: ${{ steps.import_gpg.outputs.keyid }}
          pages_url: 'https://zihad.com.bd/bengal-download-manager'

      - name: Upload Flatpak OSTree Slice Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: repo/

      - name: Build Snap Package
        uses: ./.github/actions/build-snap
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}

      - name: Stage Release Artifacts
        run: |
          mkdir -p release_artifacts
          cp dist/*.tar.xz release_artifacts/ 2>/dev/null || cp build_cmake/dist/*.tar.xz release_artifacts/ 2>/dev/null || true
          cp bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.AppImage release_artifacts/ 2>/dev/null || true
          cp bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.AppImage.zsync release_artifacts/ 2>/dev/null || true
          cp dist/bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.flatpak release_artifacts/ 2>/dev/null || cp bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.flatpak release_artifacts/ 2>/dev/null || true
          cp dist/*.snap release_artifacts/ 2>/dev/null || cp *.snap release_artifacts/ 2>/dev/null || true
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp extension-chromium-*.crx release_artifacts/ 2>/dev/null || cp extension-chromium.crx release_artifacts/ 2>/dev/null || true
            cp extension-firefox-*.xpi release_artifacts/ 2>/dev/null || cp extension-firefox.xpi release_artifacts/ 2>/dev/null || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.arch }}
          path: release_artifacts/*

  publish-flatpak:
    name: Publish Flatpak Repository
    needs: [test, prepare, build]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Flatpak OSTree Slice Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: flatpak-repo-*
          path: downloaded_slices

      - name: Import GPG Key for Release Signing
        if: env.HAS_GPG == 'true'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish Flathub-Standard Flatpak Repository
        uses: ./.github/actions/publish-flatpak-repo
        with:
          version: ${{ needs.prepare.outputs.version }}
          app_id: 'bd.com.zihad.BengalDownloadManager'
          slices_pattern: 'downloaded_slices/*'
          site_dir: '_site'
          sign: ${{ env.HAS_GPG == 'true' }}
          gpg_key: ${{ steps.import_gpg.outputs.keyid }}
          pages_url: 'https://zihad.com.bd/bengal-download-manager'

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release
    needs: [test, prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release_dist

      - name: Generate Flatpak Ref for Release
        run: |
          python3 scripts/generate_flatpak_refs.py \
            --out-dir release_dist \
            --app-id 'bd.com.zihad.BengalDownloadManager' \
            --version '${{ needs.prepare.outputs.version }}' \
            --only-versioned \
            --pages-url 'https://zihad.com.bd/bengal-download-manager' 2>/dev/null || true
          rm -f release_dist/*.flatpakrepo 2>/dev/null || true

      - name: Import GPG Key for Release Signing
        if: env.HAS_GPG == 'true'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate SHA256SUMS Checksums
        run: |
          cd release_dist
          rm -f SHA256SUMS SHA256SUMS.sig SHA256SUMS.txt
          sha256sum * > SHA256SUMS
          cd ..

      - name: Sign SHA256SUMS (GPG Detached Signature)
        if: env.HAS_GPG == 'true'
        run: |
          cd release_dist
          gpg --batch --yes --detach-sign --armor --output SHA256SUMS.sig SHA256SUMS
          cd ..

      - name: Generate Release Notes Body
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          HAS_GPG: ${{ env.HAS_GPG }}
        run: |
          export BASE_URL="${SERVER_URL}/${REPOSITORY}/releases/download/${TAG}"

          python3 - << 'EOF'
          import os
          import re
          import xml.etree.ElementTree as ET

          tag = os.environ.get("TAG", "")
          base_url = os.environ.get("BASE_URL", "")
          version = os.environ.get("VERSION", "")
          repo = os.environ.get("REPOSITORY", "tazihad/bengal-download-manager")
          has_gpg = os.environ.get("HAS_GPG", "false") == "true"
          repo_root = os.getcwd()

          def load_curated_notes(release_version):
              """Read the user-facing notes from the AppStream metainfo entry."""
              clean_version = release_version.split("-")[0]
              metainfo_path = os.path.join(
                  repo_root,
                  "flatpak",
                  "bd.com.zihad.BengalDownloadManager.metainfo.xml",
              )
              try:
                  tree = ET.parse(metainfo_path)
              except Exception as exc:
                  print(f"Notice: could not read AppStream metadata: {exc}")
                  return []

              for release in tree.getroot().iter("release"):
                  if release.get("version") != clean_version:
                      continue
                  notes = []
                  for item in release.findall("./description/ul/li"):
                      text = "".join(item.itertext()).strip()
                      if text:
                          notes.append(text)
                  return notes
              return []

          os.chdir("release_dist")
          special_files = {"SHA256SUMS", "SHA256SUMS.sig", "SHA256SUMS.txt"}
          files = [f for f in sorted(os.listdir(".")) if os.path.isfile(f) and f not in special_files and not f.endswith(".zsync")]

          linux_groups = {"AppImage": [], "Flatpak": [], "Snap": [], ".tar.xz": []}
          windows_items = []
          macos_items = []
          extension_items = []

          for fname in files:
              arch = "aarch64" if ("aarch64" in fname or "arm64" in fname) else "x86_64"
              url = f"{base_url}/{fname}"

              if fname.endswith(".AppImage"):
                  linux_groups["AppImage"].append((arch, fname, url))
              elif fname.endswith(".flatpak"):
                  linux_groups["Flatpak"].append((arch, fname, url))
              elif fname.endswith(".snap"):
                  linux_groups["Snap"].append((arch, fname, url))
              elif fname.endswith(".tar.xz"):
                  linux_groups[".tar.xz"].append((arch, fname, url))
              elif fname.endswith(".exe") or ("windows" in fname and fname.endswith(".zip")):
                  pkg = "Setup Installer" if "setup" in fname.lower() else ("Portable ZIP" if fname.endswith(".zip") else "Standalone Executable")
                  windows_items.append((pkg, arch, fname, url, ""))
              elif fname.endswith(".dmg") or ("macos" in fname and fname.endswith(".zip")):
                  pkg = ".dmg" if fname.endswith(".dmg") else ".zip"
                  macos_items.append((pkg, "Universal", fname, url, ""))
              elif fname.endswith(".crx"):
                  match = re.search(r"extension-chromium-?(.*?)\.crx", fname)
                  ext_ver = f"v{match.group(1)}" if match and match.group(1) else "v0.8"
                  extension_items.append(("Chrome / Chromium / Edge / Brave", ext_ver, ".crx", fname, url, "Drag into chrome://extensions (Developer mode ON)"))
              elif fname.endswith(".xpi"):
                  match = re.search(r"extension-firefox-?(.*?)\.xpi", fname)
                  ext_ver = f"v{match.group(1)}" if match and match.group(1) else "v0.8"
                  extension_items.append(("Firefox / Floorp / LibreWolf", ext_ver, ".xpi", fname, url, "Open or install via about:addons"))

          lines = []

          has_linux = any(len(items) > 0 for items in linux_groups.values())
          if has_linux:
              lines.append("### 🐧 Linux\n")
              lines.append("<table>")
              lines.append("  <thead>")
              lines.append("    <tr>")
              lines.append("      <th style=\"width: 15%;\">Package / Format</th>")
              lines.append("      <th style=\"text-align: center; width: 12%;\">Architecture</th>")
              lines.append("      <th style=\"white-space: nowrap;\">Download Link</th>")
              lines.append("      <th style=\"width: 25%;\">Notes</th>")
              lines.append("    </tr>")
              lines.append("  </thead>")
              lines.append("  <tbody>")

              linux_notes = {
                  "AppImage": "Universal standalone bundle",
                  "Flatpak": "Single-file offline bundle",
                  "Snap": "Canonical Snap package",
                  ".tar.xz": "Portable tarball archive"
              }

              for pkg in ["AppImage", "Flatpak", "Snap", ".tar.xz"]:
                  items = linux_groups.get(pkg, [])
                  if not items:
                      continue
                  items.sort(key=lambda x: 0 if x[0] == "x86_64" else 1)
                  count = len(items)
                  note = linux_notes.get(pkg, "")
                  first = True
                  for arch, fname, url in items:
                      lines.append("    <tr>")
                      if first:
                          if count > 1:
                              lines.append(f'      <td rowspan="{count}"><b>{pkg}</b></td>')
                          else:
                              lines.append(f'      <td><b>{pkg}</b></td>')
                      lines.append(f'      <td style="text-align: center;"><code>{arch}</code></td>')
                      lines.append(f'      <td style="white-space: nowrap;"><a href="{url}">{fname}</a></td>')
                      if first:
                          if count > 1:
                              lines.append(f'      <td rowspan="{count}">{note}</td>')
                          else:
                              lines.append(f'      <td>{note}</td>')
                      lines.append("    </tr>")
                      first = False

              lines.append("  </tbody>")
              lines.append("</table>\n")

          if windows_items:
              lines.append("### 🪟 Windows\n")
              lines.append("| Package / Format | Architecture | Download Link | Notes |")
              lines.append("| :--- | :---: | :--- | :--- |")
              for pkg, arch, fname, url, note in windows_items:
                  lines.append(f"| **{pkg}** | `{arch}` | [{fname}]({url}) | {note} |")
              lines.append("")

          if macos_items:
              lines.append("### 🍎 macOS\n")
              lines.append("| Package / Format | Architecture | Download Link | Notes |")
              lines.append("| :--- | :---: | :--- | :--- |")
              for pkg, arch, fname, url, note in macos_items:
                  lines.append(f"| **{pkg}** | `{arch}` | [{fname}]({url}) | {note} |")
              lines.append("")

          if extension_items:
              lines.append("### 🌐 Browser Extensions\n")
              lines.append("| Browser Target | Extension Ver | Format | Download Link | Installation Guide |")
              lines.append("| :--- | :---: | :---: | :--- | :--- |")
              for browser, ext_ver, fmt, fname, url, guide in extension_items:
                  lines.append(f"| **{browser}** | `{ext_ver}` | `{fmt}` | [{fname}]({url}) | {guide} |")
              lines.append("")

          lines.append("---\n")
          is_stable = not any(k in tag.lower() for k in ("alpha", "beta", "rc", "dev"))
          
          # Pre-collapsed Verification & Security
          lines.append("<details>")
          lines.append("<summary><b>🛡️ Verification & Security Guide</b> — <i>Click to expand</i></summary>\n")
          if is_stable:
              lines.append("#### GitHub Artifact Attestation (Sigstore SLSA)\n")
              lines.append("Every artifact in this release is signed and attested via GitHub Artifact Attestations.\n")
              lines.append("Verify the provenance of any downloaded binary with the GitHub CLI:\n```bash")
              lines.append(f"gh attestation verify <downloaded-file> --repo {repo}")
              lines.append("```\n")

          if os.path.exists("SHA256SUMS.sig"):
              lines.append("#### GPG Signature & Checksum Verification\n```bash")
              lines.append("# Verify SHA256SUMS signature")
              lines.append("gpg --verify SHA256SUMS.sig SHA256SUMS\n")
              lines.append("# Verify binary checksum")
              lines.append("sha256sum -c SHA256SUMS --ignore-missing")
              lines.append("```\n")
          else:
              lines.append("#### Checksum Verification\n```bash")
              lines.append("sha256sum -c SHA256SUMS --ignore-missing")
              lines.append("```\n")
          lines.append("</details>\n")

          # Pre-collapsed Checksums (SHA-256)
          if os.path.exists("SHA256SUMS"):
              lines.append("<details>")
              lines.append("<summary><b>🔒 Checksums (SHA-256)</b> — <i>Click to expand</i></summary>\n")
              lines.append("```text")
              with open("SHA256SUMS", "r") as f:
                  lines.append(f.read().strip())
              lines.append("```")
              lines.append("</details>\n")

          # Human-Friendly What's Changed
          try:
              import sys
              sys.path.insert(0, os.path.abspath(".."))
              from scripts.generate_appstream_notes import generate_notes_from_git, get_previous_tag
              curated_notes = load_curated_notes(version)
              bullet_notes = curated_notes or generate_notes_from_git(version, to_ref="HEAD")
              lines.append("## What's Changed\n")
              if bullet_notes:
                  lines.append("### Highlights")
                  for note in bullet_notes:
                      lines.append(f"* {note}")
                  lines.append("")

              # Include previous release changelog if available
              prev_tag = get_previous_tag(tag or version)
              if prev_tag:
                  try:
                      import json, urllib.request
                      gh_token = os.environ.get("GITHUB_TOKEN", "")
                      headers = {"Accept": "application/vnd.github+json", "User-Agent": "BDM-Release"}
                      if gh_token:
                          headers["Authorization"] = f"Bearer {gh_token}"
                      req = urllib.request.Request(
                          f"{os.environ.get('GITHUB_API_URL', 'https://api.github.com')}/repos/{repo}/releases/tags/{prev_tag}",
                          headers=headers
                      )
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          data = json.loads(resp.read().decode())
                          prev_body = data.get("body", "")
                          wc_idx = prev_body.find("## What's Changed")
                          if wc_idx != -1:
                              prev_wc = prev_body[wc_idx + len("## What's Changed"):].strip()
                              if prev_wc:
                                  lines.append(f"<details>\n<summary><b>Previous Release Notes ({prev_tag})</b></summary>\n\n{prev_wc}\n</details>\n")
                  except Exception as err:
                      print(f"Notice: could not fetch previous release notes for {prev_tag}: {err}")

              lines.append(f"\n**Full Changelog**: https://github.com/{repo}/compare/{prev_tag if prev_tag else tag}...{tag}")
          except Exception as e:
              print(f"Warning: could not generate human-friendly release notes: {e}")

          with open("../release_body.md", "w") as f:
              f.write("\n".join(lines))
          EOF

      - name: Generate Artifact Attestation for Stable Release
        if: ${{ !(contains(needs.prepare.outputs.tag, 'alpha') || contains(needs.prepare.outputs.tag, 'beta') || contains(needs.prepare.outputs.tag, 'rc') || contains(needs.prepare.outputs.tag, 'dev') || inputs.is_prerelease) }}
        uses: actions/attest@v4
        with:
          subject-path: 'release_dist/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release_body.md
          files: release_dist/*
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, 'alpha') || contains(needs.prepare.outputs.tag, 'beta') || contains(needs.prepare.outputs.tag, 'rc') || inputs.is_prerelease }}
          generate_release_notes: false
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
