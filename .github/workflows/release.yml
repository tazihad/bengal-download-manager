name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for auto-increment)'
        required: false
        default: ''
  push:
    branches:
      - dev
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libqt6gui6 cmake zip libfuse2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6

      - name: Determine Tag
        id: get_tag
        uses: ./.github/actions/determine-tag
        with:
          manual_tag: ${{ github.event.inputs.tag_name }}

      - name: Build Binary
        uses: ./.github/actions/build-binary
        with:
          version: ${{ steps.get_tag.outputs.version }}

      - name: Build AppImage
        uses: ./.github/actions/build-appimage
        with:
          version: ${{ steps.get_tag.outputs.version }}

      - name: Build Extension
        run: |
          cd extension
          zip -r ../extension-firefox.xpi . -x "*.git*" -x "__pycache__*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          files: |
            build_cmake/dist/bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64
            bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64.AppImage
            extension-firefox.xpi
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
