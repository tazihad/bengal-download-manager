name: Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for auto-increment)'
        required: false
        default: ''
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
      - '.gitignore'

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libqt6gui6 desktop-file-utils appstream

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Desktop Entry and Metainfo
        run: |
          desktop-file-validate flatpak/io.github.tazihad.bengal-download-manager.desktop
          appstreamcli validate flatpak/io.github.tazihad.bengal-download-manager.metainfo.xml

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          pytest -v tests/

  prepare:
    name: Determine Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
      version: ${{ steps.get_tag.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Tag
        id: get_tag
        uses: ./.github/actions/determine-tag
        with:
          manual_tag: ${{ github.event.inputs.tag_name }}

  build:
    name: Build (${{ matrix.arch }})
    needs: [test, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libqt6gui6 cmake zip libfuse2 aria2 zsync

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Update Version File
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/update-version
        with:
          version: ${{ needs.prepare.outputs.version }}

      - name: Build Binary
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/build-binary
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}

      - name: Build AppImage
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/build-appimage
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}

      - name: Build Extension
        if: github.event_name != 'pull_request' && matrix.arch == 'x86_64'
        uses: ./.github/actions/build-extension

      - name: Build Flatpak Bundle
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/build-flatpak
        with:
          version: ${{ needs.prepare.outputs.version }}
          arch: ${{ matrix.arch }}

      - name: Stage Release Artifacts
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release_artifacts
          cp build_cmake/dist/bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }} release_artifacts/ 2>/dev/null || true
          cp bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.AppImage release_artifacts/ 2>/dev/null || true
          cp bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.AppImage.zsync release_artifacts/ 2>/dev/null || true
          cp dist/bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.flatpak release_artifacts/ 2>/dev/null || cp bengal-download-manager-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.flatpak release_artifacts/ 2>/dev/null || true
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp extension-chromium.crx release_artifacts/ 2>/dev/null || true
            cp extension-firefox.xpi release_artifacts/ 2>/dev/null || true
          fi

      - name: Upload Build Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.arch }}
          path: release_artifacts/*

  release:
    name: Publish Release
    needs: [test, prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release_dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          files: release_dist/*
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
