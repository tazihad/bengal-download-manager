name: Build, Test and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for auto-increment)'
        required: false
        default: ''
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-test-release:
    name: Build, Test & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libqt6gui6 cmake zip libfuse2 aria2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 pytest pytest-qt

      - name: Run Test Suite
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v tests/

      - name: Determine Tag
        if: github.event_name != 'pull_request'
        id: get_tag
        uses: ./.github/actions/determine-tag
        with:
          manual_tag: ${{ github.event.inputs.tag_name }}

      - name: Update Version File
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/update-version
        with:
          version: ${{ steps.get_tag.outputs.version }}

      - name: Build Binary
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/build-binary
        with:
          version: ${{ steps.get_tag.outputs.version }}

      - name: Build AppImage
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/build-appimage
        with:
          version: ${{ steps.get_tag.outputs.version }}

      - name: Build Extension
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/build-extension

      - name: Build Flatpak Bundle
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/build-flatpak
        with:
          version: ${{ steps.get_tag.outputs.version }}

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          files: |
            build_cmake/dist/bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64
            bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64.AppImage
            bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64.AppImage.zsync
            bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64.flatpak
            extension-chromium.crx
            extension-firefox.xpi
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
