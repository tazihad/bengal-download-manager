name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for auto-increment)'
        required: false
        default: ''
  push:
    branches:
      - dev
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libqt6gui6 cmake zip libfuse2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6

      - name: Determine Tag
        id: get_tag
        uses: ./.github/actions/determine-tag
        with:
          manual_tag: ${{ github.event.inputs.tag_name }}

      - name: Build Binary
        uses: ./.github/actions/build-binary
        with:
          version: ${{ steps.get_tag.outputs.version }}

      - name: Build AppImage
        uses: ./.github/actions/build-appimage
        with:
          version: ${{ steps.get_tag.outputs.version }}

      - name: Build Extension
        run: |
          python scripts/pack_extension.py
          cp dist/bengal-download-manager-extension.crx extension-chromium.crx
          cd extension
          zip -r ../extension-firefox.xpi . -x "*.git*" -x "__pycache__*"

      - name: Build Flatpak Bundle
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak
          APP_ID="io.github.tazihad.bengal-download-manager"
          BUILD_DIR="flatpak_app_dir"
          mkdir -p "$BUILD_DIR/files/bin" "$BUILD_DIR/files/share/applications" "$BUILD_DIR/files/share/icons/hicolor/256x256/apps" "$BUILD_DIR/files/share/metainfo"
          cp build_cmake/dist/bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64 "$BUILD_DIR/files/bin/bengal-download-manager"
          chmod +x "$BUILD_DIR/files/bin/bengal-download-manager"
          cp assets/logo.png "$BUILD_DIR/files/share/icons/hicolor/256x256/apps/$APP_ID.png"
          cp flatpak/$APP_ID.desktop "$BUILD_DIR/files/share/applications/$APP_ID.desktop"
          cp flatpak/$APP_ID.metainfo.xml "$BUILD_DIR/files/share/metainfo/$APP_ID.metainfo.xml"
          cat << EOF > "$BUILD_DIR/metadata"
          [Application]
          name=$APP_ID
          runtime=org.kde.Platform/x86_64/6.11
          sdk=org.kde.Sdk/x86_64/6.11
          command=bengal-download-manager

          [Context]
          shared=network;ipc;
          sockets=x11;fallback-x11;wayland;pulseaudio;
          filesystems=host;xdg-download;xdg-config/kdeglobals:ro;xdg-config/gtk-3.0:ro;xdg-config/gtk-4.0:ro;
          devices=dri;

          [Session Bus Policy]
          org.freedesktop.portal.Desktop=talk
          org.freedesktop.portal.Settings=talk
          org.freedesktop.Notifications=talk

          [Environment]
          QT_QPA_PLATFORMTHEME=xdgdesktopportal
          EOF
          flatpak build-finish "$BUILD_DIR" --command=bengal-download-manager
          flatpak build-export repo "$BUILD_DIR"
          flatpak build-bundle repo bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64.flatpak $APP_ID

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          files: |
            build_cmake/dist/bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64
            bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64.AppImage
            bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64.AppImage.zsync
            bengal-download-manager-${{ steps.get_tag.outputs.version }}-x86_64.flatpak
            extension-chromium.crx
            extension-firefox.xpi
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
