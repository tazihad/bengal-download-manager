name: CD / Web Deploy

# Manual-only website deploy.
#
# `CD / Release` (release.yml) owns the Flatpak OSTree repository and publishes
# the full site together with it. This workflow exists so landing page / asset
# changes can ship without cutting a release, and therefore reuses and re-signs
# the live repository instead of rebuilding it.
#
# It is intentionally NOT triggered by `release: published`: both workflows
# deploy the same GitHub Pages artifact, so running them together would race and
# one would overwrite the other's `repo/` directory.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Import GPG Key for Repository Signing
        if: env.HAS_GPG == 'true'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Read Release Version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Assemble Site With Live Flatpak Repository
        uses: ./.github/actions/publish-flatpak-repo
        with:
          version: ${{ steps.version.outputs.value }}
          app_id: 'bd.com.zihad.BengalDownloadManager'
          slices_pattern: '' # no slices: reuse the live published repository
          site_dir: '_site'
          sign: ${{ env.HAS_GPG == 'true' }}
          gpg_key: ${{ steps.import_gpg.outputs.keyid }}
          pages_url: 'https://zihad.com.bd/bengal-download-manager'

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
