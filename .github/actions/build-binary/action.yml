name: 'Build Binary'
description: 'Builds the standalone python binary using PyInstaller and CMake'
inputs:
  version:
    description: 'Version string (without leading v)'
    required: true
  arch:
    description: 'Target architecture (x86_64 or aarch64)'
    required: false
    default: 'x86_64'

runs:
  using: "composite"
  steps:
    - name: Update Version
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        echo "Updating VERSION to $VERSION"
        echo "VERSION = \"$VERSION\"" > src/core/version.py

    - name: Build Application
      shell: bash
      run: |
        mkdir -p build_cmake
        cd build_cmake
        cmake -DPython3_EXECUTABLE=$(which python) ..
        cmake --build .
        # Preserve binary for downstream packaging (AppImage, Flatpak)
        cp dist/bengal-download-manager dist/bengal-download-manager-${VERSION}-${ARCH}
        mkdir -p ../dist
        cp dist/bengal-download-manager ../dist/bengal-download-manager
        cp dist/bengal-download-manager-${VERSION}-${ARCH} ../dist/bengal-download-manager-${VERSION}-${ARCH}

        # Package portable tarball (.tar.xz)
        VERSION="${{ inputs.version }}"
        ARCH="${{ inputs.arch }}"
        DIR_NAME="bengal-download-manager-${VERSION}-${ARCH}"
        mkdir -p "dist/${DIR_NAME}"
        cp dist/bengal-download-manager "dist/${DIR_NAME}/"
        chmod 755 "dist/${DIR_NAME}/bengal-download-manager"
        cp -r ../assets "dist/${DIR_NAME}/assets" 2>/dev/null || true
        cp ../README.md ../LICENSE "dist/${DIR_NAME}/" 2>/dev/null || true

        cd dist
        tar -cJf "bengal-download-manager-${VERSION}-${ARCH}.tar.xz" "${DIR_NAME}"
        cp "bengal-download-manager-${VERSION}-${ARCH}.tar.xz" ../../dist/ 2>/dev/null || true
        cd ..
