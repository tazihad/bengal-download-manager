name: 'Build Binary'
description: 'Builds the standalone onedir bundle using PyInstaller and CMake'
inputs:
  version:
    description: 'Version string (without leading v)'
    required: true
  arch:
    description: 'Target architecture (x86_64 or aarch64)'
    required: false
    default: 'x86_64'

runs:
  using: "composite"
  steps:
    - name: Update Version
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        echo "Updating VERSION to $VERSION"
        python3 scripts/sync_version.py --set "$VERSION"

    - name: Build Application
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        ARCH="${{ inputs.arch }}"
        DIR_NAME="bengal-download-manager-${VERSION}-${ARCH}"

        mkdir -p build_cmake
        cd build_cmake
        cmake -DPython3_EXECUTABLE=$(which python) ..
        cmake --build .
        # CMake now produces an onedir bundle: build_cmake/dist/bengal-download-manager/
        ONEDIR_DIR="dist/bengal-download-manager"
        if [ ! -x "${ONEDIR_DIR}/bengal-download-manager" ]; then
          echo "Error: onedir bundle not found at ${ONEDIR_DIR}" >&2
          ls -la dist || true
          exit 1
        fi

        # Preserve the onedir bundle for downstream packaging (DEB/RPM/Tarball)
        mkdir -p ../dist
        rm -rf "../dist/bengal-download-manager"
        cp -a "${ONEDIR_DIR}" ../dist/bengal-download-manager

        # Package portable tarball (.tar.xz) with a top-level launcher
        rm -rf "dist/${DIR_NAME}"
        mkdir -p "dist/${DIR_NAME}/lib"
        cp -a "${ONEDIR_DIR}" "dist/${DIR_NAME}/lib/bengal-download-manager"
        printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/lib/bengal-download-manager/bengal-download-manager" "$@"\n' \
          > "dist/${DIR_NAME}/bengal-download-manager"
        chmod 755 "dist/${DIR_NAME}/bengal-download-manager"
        cp ../README.md ../LICENSE "dist/${DIR_NAME}/" 2>/dev/null || true

        cd dist
        tar -cJf "bengal-download-manager-${VERSION}-${ARCH}.tar.xz" "${DIR_NAME}"
        cp "bengal-download-manager-${VERSION}-${ARCH}.tar.xz" ../../dist/ 2>/dev/null || true
        cd ..
