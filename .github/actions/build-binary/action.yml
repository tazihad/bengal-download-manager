name: 'Build Binary'
description: 'Builds the standalone python binary using PyInstaller and CMake'
inputs:
  version:
    description: 'Version string (without leading v)'
    required: true
  arch:
    description: 'Target architecture (x86_64 or aarch64)'
    required: false
    default: 'x86_64'

runs:
  using: "composite"
  steps:
    - name: Update Version
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        echo "Updating VERSION to $VERSION"
        echo "VERSION = \"$VERSION\"" > src/core/version.py

    - name: Build Application
      shell: bash
      run: |
        mkdir -p build_cmake
        cd build_cmake
        cmake -DPython3_EXECUTABLE=$(which python) ..
        cmake --build .
        # Rename binary for release
        VERSION="${{ inputs.version }}"
        ARCH="${{ inputs.arch }}"
        mv dist/bengal-download-manager dist/bengal-download-manager-${VERSION}-${ARCH}
