name: 'Build AppImage'
description: 'Builds the AppImage using linuxdeploy with zsync AppImageUpdate metadata'
inputs:
  version:
    description: 'Version string (without leading v)'
    required: true
  arch:
    description: 'Target architecture (x86_64 or aarch64)'
    required: false
    default: 'x86_64'
  release_target:
    description: 'Release target (latest or tag name)'
    required: false
    default: 'latest'
  sign:
    description: 'Sign AppImage with GPG (true/false)'
    required: false
    default: 'false'
  gpg_key:
    description: 'GPG key ID to sign with'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Build AppImage with linuxdeploy
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        ARCH="${{ inputs.arch }}"
        RELEASE_TARGET="${{ inputs.release_target }}"
        REPO_OWNER="tazihad"
        REPO_NAME="bengal-download-manager"

        # Prepare 256x256 icon compliant with XDG specs
        python -c "from PyQt6.QtGui import QImage; from PyQt6.QtCore import Qt; img = QImage('assets/logo.png'); img.scaled(256, 256, Qt.AspectRatioMode.KeepAspectRatio, Qt.TransformationMode.SmoothTransformation).save('assets/bd.com.zihad.BengalDownloadManager.png')"
        cp assets/bd.com.zihad.BengalDownloadManager.png assets/bengal-download-manager.png

        # Locate compiled binary
        RAW_EXE=""
        for candidate in \
            "build_cmake/dist/bengal-download-manager-${VERSION}-${ARCH}" \
            "build_cmake/dist/bengal-download-manager" \
            "dist/bengal-download-manager-${VERSION}-${ARCH}" \
            "dist/bengal-download-manager"; do
            if [ -f "$candidate" ]; then
                RAW_EXE="$candidate"
                break
            fi
        done
        if [ -z "$RAW_EXE" ]; then
            RAW_EXE=$(find build_cmake/dist dist -maxdepth 2 -type f -name "bengal-download-manager" -executable 2>/dev/null | head -n 1)
        fi
        echo "Using compiled binary for AppImage: $RAW_EXE"

        # Pre-populate AppDir structure using install
        rm -rf AppDir
        install -Dm755 "$RAW_EXE" AppDir/usr/bin/bengal-download-manager
        for s in 16 32 64 128 256 512; do
            if [ -f "assets/icons/${s}x${s}.png" ]; then
                install -Dm644 "assets/icons/${s}x${s}.png" "AppDir/usr/share/icons/hicolor/${s}x${s}/apps/bd.com.zihad.BengalDownloadManager.png"
                install -Dm644 "assets/icons/${s}x${s}.png" "AppDir/usr/share/icons/hicolor/${s}x${s}/apps/bengal-download-manager.png"
            fi
        done
        if [ -f assets/logo.svg ]; then
            install -Dm644 assets/logo.svg AppDir/usr/share/icons/hicolor/scalable/apps/bd.com.zihad.BengalDownloadManager.svg
            install -Dm644 assets/logo.svg AppDir/usr/share/icons/hicolor/scalable/apps/bengal-download-manager.svg
        fi
        install -Dm644 flatpak/bd.com.zihad.BengalDownloadManager.desktop AppDir/usr/share/applications/bd.com.zihad.BengalDownloadManager.desktop
        install -Dm644 flatpak/bd.com.zihad.BengalDownloadManager.desktop AppDir/usr/share/applications/bengal-download-manager.desktop
        if [ -f flatpak/bd.com.zihad.BengalDownloadManager.metainfo.xml ]; then
            install -Dm644 flatpak/bd.com.zihad.BengalDownloadManager.metainfo.xml AppDir/usr/share/metainfo/bd.com.zihad.BengalDownloadManager.metainfo.xml
            install -Dm644 flatpak/bd.com.zihad.BengalDownloadManager.metainfo.xml AppDir/usr/share/appdata/bd.com.zihad.BengalDownloadManager.appdata.xml
        fi

        # Fetch linuxdeploy and linuxdeploy-plugin-appimage binaries
        if [ ! -f linuxdeploy.AppImage ]; then
            wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH}.AppImage" -O linuxdeploy.AppImage
            chmod +x linuxdeploy.AppImage
        fi

        if [ ! -f linuxdeploy-plugin-appimage.AppImage ]; then
            wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-${ARCH}.AppImage" -O linuxdeploy-plugin-appimage.AppImage
            chmod +x linuxdeploy-plugin-appimage.AppImage
        fi

        export PATH="$PWD:$PATH"

        # Set zsync / AppImageUpdate update information metadata
        ZSYNC_INFO="gh-releases-zsync|${REPO_OWNER}|${REPO_NAME}|${RELEASE_TARGET}|bengal-download-manager-*-${ARCH}.AppImage.zsync"
        TARGET_APPIMAGE="bengal-download-manager-${VERSION}-${ARCH}.AppImage"
        TARGET_ZSYNC="bengal-download-manager-${VERSION}-${ARCH}.AppImage.zsync"

        SIGN_ENV=()
        if [ "${{ inputs.sign }}" = "true" ] || [ "${{ inputs.sign }}" = "1" ] || [ "${SIGN:-0}" = "1" ]; then
            SIGN_ENV+=(SIGN=1 LDAI_SIGN=1)
            GPG_KEY_VAL="${{ inputs.gpg_key }}"
            if [ -n "$GPG_KEY_VAL" ] || [ -n "${GPG_KEY:-}" ]; then
                KEY_ID="${GPG_KEY_VAL:-$GPG_KEY}"
                SIGN_ENV+=(GPG_KEY="$KEY_ID" LDAI_GPG_KEY="$KEY_ID")
            fi
        fi

        env "${SIGN_ENV[@]}" \
        VERSION="${VERSION}" \
        LINUXDEPLOY_OUTPUT_VERSION="${VERSION}" \
        UPDATE_INFORMATION="${ZSYNC_INFO}" \
        LDAI_UPDATE_INFORMATION="${ZSYNC_INFO}" \
        OUTPUT="${TARGET_APPIMAGE}" \
        LDAI_OUTPUT="${TARGET_APPIMAGE}" \
        ./linuxdeploy.AppImage \
            --appdir AppDir \
            --desktop-file flatpak/bd.com.zihad.BengalDownloadManager.desktop \
            --icon-file assets/bd.com.zihad.BengalDownloadManager.png \
            --output appimage

        # Ensure target files exist or move fallback generated files safely without failing set -e
        if [ ! -f "$TARGET_APPIMAGE" ]; then
            FALLBACK_APPIMAGE=$(find . -maxdepth 1 -iname "*bengal*download*manager*.AppImage" ! -name "$TARGET_APPIMAGE" -print -quit)
            if [ -n "$FALLBACK_APPIMAGE" ]; then
                mv "$FALLBACK_APPIMAGE" "$TARGET_APPIMAGE"
            fi
        fi

        if [ ! -f "$TARGET_ZSYNC" ]; then
            FALLBACK_ZSYNC=$(find . -maxdepth 1 -iname "*bengal*download*manager*.AppImage.zsync" ! -name "$TARGET_ZSYNC" -print -quit)
            if [ -n "$FALLBACK_ZSYNC" ]; then
                mv "$FALLBACK_ZSYNC" "$TARGET_ZSYNC"
            elif command -v zsyncmake &>/dev/null; then
                zsyncmake -u "$TARGET_APPIMAGE" -o "$TARGET_ZSYNC" "$TARGET_APPIMAGE"
            fi
        fi

        echo "AppImage created: $TARGET_APPIMAGE"
        echo "Zsync metadata file created: $TARGET_ZSYNC"
