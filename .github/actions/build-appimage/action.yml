name: 'Build AppImage'
description: 'Builds the AppImage for the application'
inputs:
  version:
    description: 'Version string (without leading v)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Build AppImage
      shell: bash
      run: |
        # 1. Create AppDir structure
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        
        # 2. Copy assets
        VERSION="${{ inputs.version }}"
        cp build_cmake/dist/bengal-download-manager-${VERSION}-x86_64 AppDir/usr/bin/bengal-download-manager
        cp assets/bengal-download-manager.desktop AppDir/
        cp assets/logo.png AppDir/bengal-download-manager.png
        cp assets/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/bengal-download-manager.png
        
        # 3. Create AppRun script
        cat > AppDir/AppRun <<EOF
        #!/bin/sh
        HERE="\$(dirname "\$(readlink -f "\${0}")")"
        exec "\${HERE}/usr/bin/bengal-download-manager" "\$@"
        EOF
        chmod +x AppDir/AppRun
        
        # 4. Download appimagetool (Using continuous release as recommended)
        wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        
        # 5. Build AppImage (Extract and run to avoid FUSE issues in CI)
        ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir bengal-download-manager-${VERSION}-x86_64.AppImage
