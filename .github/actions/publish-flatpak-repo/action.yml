name: 'Publish Flatpak Repository'
description: 'Merges multi-arch Flatpak OSTree slices into a stable-only repo, signs the summary with GPG, and stages GitHub Pages'
inputs:
  version:
    description: 'Release version'
    required: true
  app_id:
    description: 'Application ID'
    required: false
    default: 'bd.com.zihad.BengalDownloadManager'
  slices_pattern:
    description: 'Directory pattern where arch slices are downloaded. Leave empty to reuse (and re-sign) the live repository, e.g. for a manual site-only deploy.'
    required: false
    default: 'flatpak-repo-*'
  site_dir:
    description: 'Target directory for GitHub Pages staging'
    required: false
    default: '_site'
  gpg_key:
    description: 'GPG Key ID for signing (must already be imported into the runner keyring)'
    required: false
    default: ''
  collection_id:
    description: 'OSTree Collection ID. One per repo; must stay constant for the lifetime of the repo.'
    required: false
    default: 'bd.com.zihad.Stable'
  sign:
    description: 'Whether to sign with GPG (requires gpg_key)'
    required: false
    default: 'false'
  pages_url:
    description: 'Base URL of the published site'
    required: false
    default: 'https://zihad.com.bd/bengal-download-manager'

runs:
  using: 'composite'
  steps:
    - name: Install Flatpak and OSTree Tools
      uses: ./.github/actions/setup-apt
      with:
        packages: flatpak ostree appstream appstream-compose

    - name: Assemble Stable-Only Flatpak Repository
      shell: bash
      run: |
        set -euo pipefail

        SITE_DIR="${{ inputs.site_dir }}"
        REPO_DIR="$SITE_DIR/repo"
        APP_ID="${{ inputs.app_id }}"
        VERSION="${{ inputs.version }}"
        PAGES_URL="${{ inputs.pages_url }}"
        SIGN="${{ inputs.sign }}"
        GPG_KEY="${{ inputs.gpg_key }}"
        COLLECTION_ID="${{ inputs.collection_id }}"

        # This repo only ever publishes the stable branch.
        BRANCH="stable"
        IS_PRERELEASE="false"
        if [[ "${VERSION,,}" =~ (alpha|beta|rc|dev) ]]; then
          IS_PRERELEASE="true"
          echo "::notice::Version '$VERSION' is a pre-release; it will NOT be published to the stable repo."
        fi

        # Fail early if signing was requested but cannot work
        if [ "$SIGN" = "true" ]; then
          if [ -z "$GPG_KEY" ]; then
            echo "::error::sign=true but gpg_key is empty"
            exit 1
          fi
          command -v gpg >/dev/null || { echo "::error::gpg is not installed on this runner"; exit 1; }
          gpg --list-secret-keys "$GPG_KEY" >/dev/null 2>&1 \
            || { echo "::error::GPG key $GPG_KEY is not in the runner keyring (import it before this action)"; exit 1; }
        fi

        echo "=== Assembling OSTree Repository at $REPO_DIR (Collection: $COLLECTION_ID, Branch: $BRANCH) ==="
        mkdir -p "$SITE_DIR" "$REPO_DIR"
        if [ ! -f "$REPO_DIR/config" ]; then
          ostree init --mode=archive --repo="$REPO_DIR" --collection-id="$COLLECTION_ID"
        fi
        ostree config --repo="$REPO_DIR" set "core.collection-id" "$COLLECTION_ID"
        mkdir -p "$REPO_DIR/refs/heads" "$REPO_DIR/refs/remotes" "$REPO_DIR/refs/mirrors" "$REPO_DIR/objects"

        # Pull existing history from the live repository so parent commits and the stable branch are retained
        if [ -n "$PAGES_URL" ]; then
          echo "Pulling existing repository history from $PAGES_URL/repo into $REPO_DIR..."
          ostree remote add --repo="$REPO_DIR" --no-gpg-verify origin-remote "$PAGES_URL/repo" || true
          ostree pull --repo="$REPO_DIR" --mirror origin-remote \
            || ostree pull --repo="$REPO_DIR" origin-remote \
            || echo "::warning::Could not pull existing history (expected on the first publish)"
          ostree remote delete --repo="$REPO_DIR" origin-remote || true
          rm -rf "$REPO_DIR"/refs/remotes/*
          mkdir -p "$REPO_DIR/refs/heads" "$REPO_DIR/refs/remotes" "$REPO_DIR/refs/mirrors"
        fi

        # Remove every app/runtime ref that is not on the stable branch (e.g. the old alpha ref)
        echo "=== Pruning non-stable refs ==="
        { ostree refs --repo="$REPO_DIR" | grep -E '^(app|runtime)/' | grep -v '/stable$' || true; } \
          | while read -r ref; do
              [ -n "$ref" ] || continue
              echo "Removing non-stable ref: $ref"
              ostree refs --repo="$REPO_DIR" --delete "$ref"
            done

        # Merge new architecture slices (stable releases only). An empty
        # slices_pattern means "reuse the live repository" (manual site deploy):
        # the history pulled above is re-signed and republished as-is.
        SLICE_COUNT=0
        SLICES_PATTERN="${{ inputs.slices_pattern }}"
        if [ "$IS_PRERELEASE" = "false" ]; then
          for slice in $SLICES_PATTERN; do
            if [ -d "$slice" ]; then
              echo "Preparing OSTree directory structure for slice: $slice"
              rm -rf "$slice"/refs/remotes/* "$slice"/refs/mirrors/*
              mkdir -p "$slice/refs/heads" "$slice/refs/remotes" "$slice/refs/mirrors" "$slice/objects"

              echo "Merging architecture slice: $slice -> $REPO_DIR"
              ostree pull-local --repo="$REPO_DIR" "$slice"
              SLICE_COUNT=$((SLICE_COUNT + 1))
            fi
          done
          if [ -n "$SLICES_PATTERN" ] && [ "$SLICE_COUNT" -eq 0 ]; then
            echo "::error::No architecture slices matched '$SLICES_PATTERN'"
            exit 1
          fi
          if [ -z "$SLICES_PATTERN" ]; then
            echo "No slices requested; republishing the live repository as-is."
          else
            echo "Merged $SLICE_COUNT slice(s)"
          fi
        else
          echo "Skipping slice merge for pre-release; republishing existing stable repo."
        fi

        # Update repository summary, prune unreferenced objects, regenerate deltas (with GPG if enabled)
        if [ "$SIGN" = "true" ]; then
          echo "Signing OSTree repo summary with GPG Key: $GPG_KEY (Collection: $COLLECTION_ID)"
          flatpak build-update-repo --collection-id="$COLLECTION_ID" --gpg-sign="$GPG_KEY" --prune --generate-static-deltas "$REPO_DIR"
          gpg --armor --export "$GPG_KEY" > "$REPO_DIR/$APP_ID.gpg"
          echo "Exported GPG public key to $REPO_DIR/$APP_ID.gpg"
        else
          echo "Updating OSTree repo summary without GPG signing (Collection: $COLLECTION_ID)"
          flatpak build-update-repo --collection-id="$COLLECTION_ID" --prune --generate-static-deltas "$REPO_DIR"
        fi

        # Fail the job now if the repo index is incomplete or contains non-stable refs
        echo "=== Verifying repository index ==="
        ls -la "$REPO_DIR"
        [ -s "$REPO_DIR/summary" ] || { echo "::error::summary missing from $REPO_DIR"; exit 1; }
        if [ "$SIGN" = "true" ]; then
          [ -s "$REPO_DIR/summary.sig" ] || { echo "::error::summary.sig missing"; exit 1; }
        fi
        REFS="$(ostree refs --repo="$REPO_DIR")"
        echo "$REFS"
        echo "$REFS" | grep -q "app/$APP_ID/.*/stable\$" \
          || { echo "::error::no app/$APP_ID stable ref in repo"; exit 1; }

        SUMMARY_VIEW="$(ostree summary --view --repo="$REPO_DIR")"
        if echo "$SUMMARY_VIEW" | grep -E '(app|runtime)/[A-Za-z0-9._-]+/[A-Za-z0-9_]+/(alpha|beta|rc|dev)'; then
          echo "::error::signed summary still lists non-stable refs (shown above)"
          exit 1
        fi
        echo "$REFS" | grep -q '^appstream' \
          || echo "::warning::no appstream refs found; GNOME Software won't list the app"

        # Generate Flathub-standard .flatpakrepo and .flatpakref files (always for the stable branch)
        GPG_ARG=""
        if [ "$SIGN" = "true" ]; then
          GPG_ARG="--gpg-key $GPG_KEY"
        fi

        # Only real releases publish a versioned ref; a manual site deploy must
        # not drop a bengal-download-manager-<version>.flatpakref into the site root.
        VERSION_ARG=""
        if [ "$SLICE_COUNT" -gt 0 ]; then
          VERSION_ARG="--version $VERSION"
        fi

        python3 scripts/generate_flatpak_refs.py \
          --repo-dir "$REPO_DIR" \
          --out-dir "$SITE_DIR" \
          --app-id "$APP_ID" \
          $VERSION_ARG \
          --branch "$BRANCH" \
          --collection-id "$COLLECTION_ID" \
          --pages-url "$PAGES_URL" \
          $GPG_ARG

        # Copy the full landing page into the Pages staging root. CD / Release and
        # the manual CD / Web Deploy workflow both deploy this same artifact, so
        # every asset has to be staged here or one workflow will strip what the
        # other added.
        cp index.html "$SITE_DIR/"
        cp -r assets "$SITE_DIR/"
        if [ -d site ]; then
          cp -r site "$SITE_DIR/"
        fi
        if [ -d privacy ]; then
          cp -r privacy "$SITE_DIR/"
        fi
        touch "$SITE_DIR/.nojekyll"

        echo "✓ Pages staging directory prepared at $SITE_DIR"
