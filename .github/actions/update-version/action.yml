name: 'Update Version'
description: 'Updates src/core/version.py and AppStream metainfo XML with release version'
inputs:
  version:
    description: 'Release version string (e.g., 0.1.20-alpha.16 or 0.1.21)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Write Version File and Update Metainfo XML
      shell: bash
      run: |
        VER="${{ inputs.version }}"
        if [ -n "$VER" ]; then
          echo "Updating src/core/version.py with release version: $VER"
          python3 -c "import sys; f=open('src/core/version.py', 'w'); f.write('# Generated by GitHub Actions release workflow\nVERSION = ' + repr(sys.argv[1]) + '\n'); f.close()" "$VER"
          cat src/core/version.py

          if [ -f "flatpak/io.github.tazihad.bengal-download-manager.metainfo.xml" ]; then
            TODAY=$(date +'%Y-%m-%d')
            echo "Updating metainfo.xml with version: $VER and date: $TODAY"
            python3 -c '
        import sys, re
        ver = sys.argv[1]
        today = sys.argv[2]
        path = "flatpak/io.github.tazihad.bengal-download-manager.metainfo.xml"
        with open(path, "r") as f:
            content = f.read()
        new_release = f"<releases>\n    <release version=\"{ver}\" date=\"{today}\"/>\n  </releases>"
        content = re.sub(r"<releases>.*?</releases>", new_release, content, flags=re.DOTALL)
        with open(path, "w") as f:
            f.write(content)
        ' "$VER" "$TODAY"
            cat flatpak/io.github.tazihad.bengal-download-manager.metainfo.xml
          fi

          if [ -f "snap/snapcraft.yaml" ]; then
            echo "Updating snapcraft.yaml with version: $VER"
            python3 -c '
        import sys, re
        ver = sys.argv[1]
        path = "snap/snapcraft.yaml"
        with open(path, "r") as f:
            content = f.read()
        content = re.sub(r"version:\s*[\x27\"][^\x27\"]+[\x27\"]", f"version: \x27{ver}\x27", content)
        with open(path, "w") as f:
            f.write(content)
        ' "$VER"
            grep -E "^(version:|adopt-info:)" snap/snapcraft.yaml || true
          fi
        else
          echo "No version provided to update-version action."
        fi
