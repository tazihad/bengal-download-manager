name: 'Build Flatpak'
description: 'Builds the Flatpak bundle for the application with compiled AppStream catalog'
inputs:
  version:
    description: 'Version string (without leading v)'
    required: true
  arch:
    description: 'Target architecture (x86_64 or aarch64)'
    required: false
    default: 'x86_64'

runs:
  using: "composite"
  steps:
    - name: Build Flatpak Bundle
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y flatpak appstream appstream-util
        APP_ID="io.github.tazihad.bengal-download-manager"
        BUILD_DIR="flatpak_app_dir"
        VERSION="${{ inputs.version }}"
        ARCH="${{ inputs.arch }}"
        mkdir -p "$BUILD_DIR/files/bin" "$BUILD_DIR/files/share/applications" "$BUILD_DIR/files/share/icons/hicolor/256x256/apps" "$BUILD_DIR/files/share/metainfo" "$BUILD_DIR/files/share/appdata" "$BUILD_DIR/files/share/appstream"
        cp build_cmake/dist/bengal-download-manager-${VERSION}-${ARCH} "$BUILD_DIR/files/bin/bengal-download-manager"
        chmod +x "$BUILD_DIR/files/bin/bengal-download-manager"
        
        if [ -f "assets/bin/${ARCH}/aria2c" ]; then
          cp "assets/bin/${ARCH}/aria2c" "$BUILD_DIR/files/bin/aria2c"
          chmod +x "$BUILD_DIR/files/bin/aria2c"
        fi

        cp assets/io.github.tazihad.bengal-download-manager.png "$BUILD_DIR/files/share/icons/hicolor/256x256/apps/$APP_ID.png" 2>/dev/null || cp assets/logo.png "$BUILD_DIR/files/share/icons/hicolor/256x256/apps/$APP_ID.png"
        cp flatpak/$APP_ID.desktop "$BUILD_DIR/files/share/applications/$APP_ID.desktop"
        cp flatpak/$APP_ID.metainfo.xml "$BUILD_DIR/files/share/metainfo/$APP_ID.metainfo.xml"
        cp flatpak/$APP_ID.metainfo.xml "$BUILD_DIR/files/share/appdata/$APP_ID.appdata.xml"

        # Compose AppStream catalog metadata
        appstreamcli compose --origin=flatpak --prefix="$BUILD_DIR/files" "$BUILD_DIR/files/share/metainfo/$APP_ID.metainfo.xml" 2>/dev/null || appstream-util compose --origin=flatpak "$BUILD_DIR/files/share/metainfo/$APP_ID.metainfo.xml" "$BUILD_DIR/files/share/appstream" 2>/dev/null || true

        cat << EOF > "$BUILD_DIR/metadata"
        [Application]
        name=$APP_ID
        runtime=org.kde.Platform/${ARCH}/6.11
        sdk=org.kde.Sdk/${ARCH}/6.11
        command=bengal-download-manager

        [Context]
        shared=network;ipc;
        sockets=x11;fallback-x11;wayland;pulseaudio;
        filesystems=host;xdg-download;xdg-config/kdeglobals:ro;xdg-config/gtk-3.0:ro;xdg-config/gtk-4.0:ro;xdg-data/icons:ro;~/.icons:ro;~/.local/share/icons:ro;
        devices=dri;

        [Session Bus Policy]
        org.freedesktop.portal.Desktop=talk
        org.freedesktop.portal.Settings=talk
        org.freedesktop.Notifications=talk
        org.kde.StatusNotifierWatcher=talk
        org.freedesktop.StatusNotifierWatcher=talk
        org.kde.StatusNotifierItem.*=own
        org.freedesktop.StatusNotifierItem.*=own

        [Environment]
        QT_QPA_PLATFORMTHEME=xdgdesktopportal
        EOF

        flatpak build-finish "$BUILD_DIR" --command=bengal-download-manager
        flatpak build-export repo "$BUILD_DIR"
        flatpak build-update-repo repo
        flatpak build-bundle repo bengal-download-manager-${VERSION}-${ARCH}.flatpak $APP_ID
