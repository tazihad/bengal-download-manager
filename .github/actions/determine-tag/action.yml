name: 'Determine Tag'
description: 'Determines the release tag and version string based on branch and history'
inputs:
  manual_tag:
    description: 'Manually provided tag from workflow_dispatch'
    required: false
    default: ''
outputs:
  tag:
    description: 'The final determined tag (e.g., v0.1.5-alpha.2)'
    value: ${{ steps.logic.outputs.tag }}
  version:
    description: 'The version string without leading v (e.g., 0.1.5-alpha.2)'
    value: ${{ steps.logic.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Run Tag Determination Logic
      id: logic
      shell: bash
      run: |
        python3 - << 'EOF'
        import os
        import re
        import subprocess

        def advance_version(x, y, z):
            # Advance patch version; rollover to minor when reaching or exceeding 99
            if z >= 99:
                return x, y + 1, "00"
            return x, y, f"{z + 1:02d}"

        manual_tag = """${{ inputs.manual_tag }}""".strip()
        ref = """${{ github.ref }}""".strip()
        github_output = os.environ.get("GITHUB_OUTPUT")

        pattern = re.compile(r"^v?([0-9]+)\.([0-9]+)\.([0-9]+)(?:-([a-zA-Z]+)\.([0-9]+))?$")

        if manual_tag:
            tag = manual_tag if manual_tag.startswith("v") else f"v{manual_tag}"
            version = tag[1:] if tag.startswith("v") else tag
        else:
            try:
                raw_tags = subprocess.check_output(["git", "tag", "-l"]).decode("utf-8").split("\n")
            except Exception:
                raw_tags = []

            parsed = []
            existing_tags = set()
            for t in raw_tags:
                t_clean = t.strip()
                if not t_clean:
                    continue
                existing_tags.add(t_clean)
                m = pattern.match(t_clean)
                if m:
                    x = int(m.group(1))
                    y = int(m.group(2))
                    z = int(m.group(3))
                    z_raw = m.group(3)
                    suffix = m.group(4) or ""
                    is_stable = (suffix == "")
                    n = int(m.group(5)) if m.group(5) else 0
                    parsed.append((x, y, z, is_stable, n, z_raw, suffix, t_clean))

            if not parsed:
                latest = (0, 1, 0, False, 0, "00", "alpha", "v0.1.00-alpha.0")
            else:
                parsed.sort(key=lambda item: (item[0], item[1], item[2], item[3], item[4]))
                latest = parsed[-1]

            x, y, z, is_stable, n, z_raw, suffix, latest_tag = latest
            suffix = suffix or "alpha"
            print(f"Latest tag found: {latest_tag}")

            is_main = (ref == "refs/heads/main")

            if is_main:
                if not is_stable:
                    # Latest tag was pre-release vX.Y.Z-alpha.N -> stable release tag is vX.Y.Z
                    tag = f"v{x}.{y}.{z:02d}"
                else:
                    # Latest tag was stable vX.Y.Z -> advance version
                    nx, ny, nz = advance_version(x, y, z)
                    tag = f"v{nx}.{ny}.{nz}"

                # Ensure tag does not already exist
                while tag in existing_tags:
                    m = pattern.match(tag)
                    if m:
                        tx, ty, tz = int(m.group(1)), int(m.group(2)), int(m.group(3))
                        nx, ny, nz = advance_version(tx, ty, tz)
                        tag = f"v{nx}.{ny}.{nz}"
                    else:
                        break
            else:
                # Pre-release (e.g. push to dev or feature branch)
                if not is_stable:
                    # Already in pre-release cycle vX.Y.Z-alpha.N -> increment N
                    next_n = n + 1
                    tag = f"v{x}.{y}.{z:02d}-{suffix}.{next_n}"
                else:
                    # Latest tag was stable vX.Y.Z -> advance to upcoming pre-release (vX.Y.(Z+1)-alpha.1 or vX.(Y+1).00-alpha.1)
                    nx, ny, nz = advance_version(x, y, z)
                    tag = f"v{nx}.{ny}.{nz}-alpha.1"

                # Ensure tag does not already exist
                while tag in existing_tags:
                    m = pattern.match(tag)
                    if m:
                        tx, ty, tz = int(m.group(1)), int(m.group(2)), int(m.group(3))
                        tsuffix = m.group(4) or "alpha"
                        tn = int(m.group(5)) if m.group(5) else 0
                        tag = f"v{tx}.{ty}.{tz:02d}-{tsuffix}.{tn + 1}"
                    else:
                        break

            version = tag[1:] if tag.startswith("v") else tag

        print(f"Determined Tag: {tag}")
        print(f"Determined Version: {version}")

        if github_output:
            with open(github_output, "a") as f:
                f.write(f"tag={tag}\n")
                f.write(f"version={version}\n")
        EOF
