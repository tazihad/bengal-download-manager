name: 'Build Native Packages'

description: 'Builds .deb and .rpm packages from the standalone binary using nFPM'

inputs:

  version:
    description: 'Version string (without leading v)'
    required: true

  arch:
    description: 'Target architecture (x86_64 or aarch64)'
    required: false
    default: 'x86_64'

runs:
  using: "composite"

  steps:
    - name: Install nFPM
      shell: bash
      env:
        NFPM_VERSION: '2.48.0'
      run: |

        set -euo pipefail

        case "${{ inputs.arch }}" in
          x86_64|amd64) NFPM_ASSET_ARCH="x86_64" ;;
          aarch64|arm64) NFPM_ASSET_ARCH="arm64" ;;
          *)
            echo "Unsupported architecture: ${{ inputs.arch }}" >&2
            exit 1
            ;;
        esac

        TMP_DIR="$(mktemp -d)"
        ASSET="nfpm_${NFPM_VERSION}_Linux_${NFPM_ASSET_ARCH}.tar.gz"
        BASE_URL="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"

        curl -fsSL "${BASE_URL}/${ASSET}" -o "${TMP_DIR}/${ASSET}"
        curl -fsSL "${BASE_URL}/checksums.txt" -o "${TMP_DIR}/checksums.txt"
        (cd "${TMP_DIR}" && grep " ${ASSET}$" checksums.txt | sha256sum -c -)
        tar -xzf "${TMP_DIR}/${ASSET}" -C "${TMP_DIR}" nfpm
        sudo install -m 0755 "${TMP_DIR}/nfpm" /usr/local/bin/nfpm
        rm -rf "${TMP_DIR}"

        nfpm --version

    - name: Build .deb and .rpm packages
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |

        set -euo pipefail

        case "${{ inputs.arch }}" in
          x86_64|amd64) export NFPM_ARCH="amd64" ;;
          aarch64|arm64) export NFPM_ARCH="arm64" ;;
          *)
            echo "Unsupported architecture: ${{ inputs.arch }}" >&2
            exit 1
            ;;
        esac

        VERSION="${VERSION#v}"
        export VERSION

        RAW_EXE=""

        for candidate in \
          "build_cmake/dist/bengal-download-manager-${VERSION}-${{ inputs.arch }}" \
          "build_cmake/dist/bengal-download-manager" \
          "dist/bengal-download-manager-${VERSION}-${{ inputs.arch }}" \
          "dist/bengal-download-manager"; do
          if [ -f "$candidate" ]; then
            RAW_EXE="$candidate"
            break
          fi
        done

        if [ -z "$RAW_EXE" ]; then
          RAW_EXE=$(find build_cmake/dist dist -maxdepth 2 -type f -name "bengal-download-manager" -executable 2>/dev/null | head -n 1)
        fi

        if [ -z "$RAW_EXE" ] || [ ! -f "$RAW_EXE" ]; then
          echo "Standalone binary not found; build it before packaging." >&2
          exit 1
        fi

        echo "Packaging binary: $RAW_EXE (version=${VERSION}, arch=${NFPM_ARCH})"

        mkdir -p dist

        if [ "$(realpath "$RAW_EXE")" != "$(realpath -m dist/bengal-download-manager)" ]; then
          install -m 0755 "$RAW_EXE" dist/bengal-download-manager
        fi

        nfpm package -f nfpm.yaml -p deb -t dist/
        nfpm package -f nfpm.yaml -p rpm -t dist/

        ls -lh dist/*.deb dist/*.rpm
